# Static file server for the built SPA (docker-compose.yml expects the
# `web` service to answer HTTP 200 on `/`, per architecture.md §3).
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: any path that isn't a real static asset falls back to
  # index.html so client-side state (not routing, today — but this keeps a
  # direct reload or a future route from 404ing) resolves correctly.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted build assets (dist/assets/*) are safe to cache hard;
  # index.html itself is not fingerprinted and must always revalidate.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
