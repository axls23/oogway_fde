services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny_growth_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny@db:5432/lenny_growth_assistant
      AGENT_BASE_URL: http://agent:8100
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ingest/seed:/app/seed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  agent:
    build:
      context: ./agent
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      AGENT_PORT: "8100"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PI_OFFLINE: "1"
    ports:
      - "8100:8100"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pi-sessions:/app/.pi/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  pi-sessions:
