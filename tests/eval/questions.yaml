# tests/eval/questions.yaml — the fixed evaluation set behind PRD AC2/AC3.
#
# Written BEFORE the retrieval pipeline was built (per PRD §10 implementation
# plan: "eval set written by hand first"), against real episode titles pulled
# from the actual corpus clone (`ingest/corpus/episodes/*/transcript.md`) on
# 2026-08-24 — not invented topics. `run_eval.py` runs each question through
# the live API and reports citations for human grading (grounded_answer_rate,
# PRD §3) plus mechanically asserts the out-of-corpus set abstains (AC3).

