# Deliberately outside the corpus's subject matter (product/growth/tech
# operator advice). Must abstain — a confident answer here is a fabrication,
# not a save. PRD §3 guardrail metric, target 5/5.
out_of_corpus:
  - id: o01
    question: "What's causing the current global shortage of semiconductor-grade silicon wafers?"
  - id: o02
    question: "How should I structure a Roth IRA conversion to minimize this year's tax liability?"
